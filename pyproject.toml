[project]
name = "zelos-extension-oscilloscope"
version = "0.1.2"
description = "Simulated oscilloscope for demos and testing, with no hardware: 1, 2, 4, 8 or 16 channels of sine waves with noise, streamed as signals, plus burst captures at up to 1 MHz for up to 3 s."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension"]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-oscilloscope"
Repository = "https://github.com/zeloscloud/zelos-extension-oscilloscope"
Issues = "https://github.com/zeloscloud/zelos-extension-oscilloscope/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_oscilloscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
