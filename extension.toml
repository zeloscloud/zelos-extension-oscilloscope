name = "Oscilloscope"
version = "0.1.2"
description = "Simulated oscilloscope for demos and testing, with no hardware: 1, 2, 4, 8 or 16 channels of sine waves with noise, streamed as signals, plus burst captures at up to 1 MHz for up to 3 s."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-oscilloscope"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["oscilloscope", "waveform", "signal", "acquisition", "dsp", "simulator", "demo", "signal generator", "sine wave", "synthetic data", "test signals", "virtual scope", "mock", "burst capture", "sample rate", "noise"]
categories = ["Test & Measurement", "Signal Analysis", "Simulation"]
icon = "assets/icon.svg"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_oscilloscope", "CHANGELOG.md"]
